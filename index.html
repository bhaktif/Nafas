<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nafas</title>
<meta property="og:title" content="Nafas">
<meta property="og:description" content="Web app sederhana untuk latihan nafas pelan.">
<meta property="og:image" content="/og-nafas.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Nafas">
<meta name="twitter:image" content="/og-nafas.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%;
  }
  body {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    background:#eeeeef;
    background-image: radial-gradient(circle at 50% 50%, #fbfbfc 0%, #eeeeef 40%, #dcdcdf 100%);
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    color:#52525b;
    overflow:hidden;
    position:relative;
  }
  .title {
    margin-top:40px;
    font-size:15px;
    font-weight:400;
    letter-spacing:0.3px;
    color:#bbbbbb;
    position:relative;
    cursor:pointer;
  }
  .title .tooltip {
    position:absolute;
    top:calc(100% + 8px);
    left:50%;
    transform:translateX(-50%) translateY(-4px);
    background:#ffffff;
    color:#71717a;
    font-size:12px;
    font-weight:500;
    padding:10px 14px;
    border-radius:10px;
    white-space:nowrap;
    text-decoration:none;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease, transform 0.2s ease;
    box-shadow:0 4px 14px rgba(0,0,0,0.08);
  }
  .title .tooltip:hover {
    text-decoration:underline;
  }
  .title .tooltip::after {
    content:'↗';
    display:inline-block;
    margin-left:4px;
    font-size:10px;
    vertical-align:super;
  }
  .title.tooltip-active .tooltip {
    opacity:1;
    transform:translateX(-50%) translateY(0);
    pointer-events:auto;
  }
  .center {
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .circle {
    width:170px;
    height:170px;
    border-radius:50%;
    border:none;
    background:#ffffff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-size:16px;
    font-weight:500;
    color:#8a8a92;
    cursor:pointer;
    transition: transform 4s ease-in-out, border-color 0.3s;
  }
  .circle.inhale { transform: scale(1.6); transition-duration:4s; }
  .circle.hold { transform: scale(1.6); transition-duration:0.2s; }
  .circle.exhale { transform: scale(1); transition-duration:6s; }
  .circle.idle {
    animation: pulse 3.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow:0 0 0 0 rgba(0,0,0,0.04); }
    50% { transform: scale(1.05); box-shadow:0 0 0 14px rgba(0,0,0,0); }
  }
  .dot-wrap {
    display:inline-block;
  }
  .dot-wrap span {
    opacity:0;
    animation: dotfade 1.8s ease-in-out infinite;
  }
  .dot-wrap span:nth-child(1) { animation-delay:0s; }
  .dot-wrap span:nth-child(2) { animation-delay:0.3s; }
  .dot-wrap span:nth-child(3) { animation-delay:0.6s; }
  @keyframes dotfade {
    0% { opacity:0; }
    30% { opacity:1; }
    60% { opacity:1; }
    100% { opacity:0; }
  }
  .counter {
    margin-top:0;
    font-size:12px;
    color:#a8a8ae;
    font-weight:500;
  }

  /* custom dropdown */
  .dropdown {
    position:relative;
    margin-bottom:44px;
    user-select:none;
  }
  .dropdown-trigger {
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 16px;
    border-radius:20px;
    background:#ffffff;
    color:#5b5b62;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
  }
  .dropdown-trigger .arrow {
    width:7px;
    height:7px;
    border-right:1.5px solid #a8a8ae;
    border-bottom:1.5px solid #a8a8ae;
    transform:rotate(45deg);
    transition:transform 0.2s;
  }
  .dropdown.open .dropdown-trigger .arrow {
    transform:rotate(225deg);
  }
  .dropdown-menu {
    position:absolute;
    bottom:calc(100% + 8px);
    left:50%;
    transform:translateX(-50%) translateY(6px);
    background:#ffffff;
    border-radius:14px;
    padding:6px;
    width:180px;
    box-shadow:0 4px 18px rgba(0,0,0,0.08);
    display:flex;
    flex-direction:column;
    gap:2px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease, transform 0.2s ease;
  }
  .dropdown.open .dropdown-menu {
    opacity:1;
    transform:translateX(-50%) translateY(0);
    pointer-events:auto;
  }
  .dropdown-item {
    padding:9px 12px;
    border-radius:10px;
    font-size:13px;
    font-weight:500;
    color:#6b6b72;
    cursor:pointer;
  }
  .dropdown-item:hover {
    background:#f4f4f5;
  }
  .dropdown-item.selected {
    background:#eeeeef;
    color:#3f3f46;
  }
</style>
</head>
<body>
  <div class="title" id="titleEl">Nafas
    <a class="tooltip" href="https://bhaktif.framer.website/" target="_blank" rel="noopener">BF © 2026</a>
  </div>

  <div class="center">
    <div class="circle idle" id="circle">
      <span id="circleText">Mulai</span>
      <div class="counter" id="counter"></div>
    </div>
  </div>

  <div class="dropdown" id="dropdown">
    <div class="dropdown-trigger" id="dropdownTrigger">
      <span id="dropdownLabel">4-4-6</span>
      <span class="arrow"></span>
    </div>
    <div class="dropdown-menu" id="dropdownMenu">
      <div class="dropdown-item" data-value="4-4-4">4-4-4</div>
      <div class="dropdown-item" data-value="4-7-8">4-7-8</div>
      <div class="dropdown-item selected" data-value="4-4-6">4-4-6</div>
      <div class="dropdown-item" data-value="5-0-5">5-5</div>
    </div>
  </div>

<script>
const circle = document.getElementById('circle');
const circleText = document.getElementById('circleText');
const counter = document.getElementById('counter');
const titleEl = document.getElementById('titleEl');

titleEl.addEventListener('click', (e) => {
  if (e.target.closest('.tooltip')) return;
  titleEl.classList.toggle('tooltip-active');
});
document.addEventListener('click', (e) => {
  if (!titleEl.contains(e.target)) titleEl.classList.remove('tooltip-active');
});
const dropdown = document.getElementById('dropdown');
const dropdownTrigger = document.getElementById('dropdownTrigger');
const dropdownMenu = document.getElementById('dropdownMenu');
const dropdownLabel = document.getElementById('dropdownLabel');
const dropdownItems = document.querySelectorAll('.dropdown-item');

let selectedPattern = '4-4-6';
let running = false;
let phaseIndex = 0;
let timer = null;
let countInterval = null;

const patternMap = {
  '4-4-4': [['Tarik',4,'inhale'],['Tahan',4,'hold'],['Lepaskan',4,'exhale']],
  '4-7-8': [['Tarik',4,'inhale'],['Tahan',7,'hold'],['Lepaskan',8,'exhale']],
  '4-4-6': [['Tarik',4,'inhale'],['Tahan',4,'hold'],['Lepaskan',6,'exhale']],
  '5-0-5': [['Tarik',5,'inhale'],['Lepaskan',5,'exhale']],
};

let phases = patternMap[selectedPattern];

dropdownTrigger.addEventListener('click', () => {
  dropdown.classList.toggle('open');
});

document.addEventListener('click', (e) => {
  if (!dropdown.contains(e.target)) dropdown.classList.remove('open');
});

dropdownItems.forEach(item => {
  item.addEventListener('click', () => {
    dropdownItems.forEach(i => i.classList.remove('selected'));
    item.classList.add('selected');
    selectedPattern = item.dataset.value;
    dropdownLabel.textContent = item.textContent;
    dropdown.classList.remove('open');
    if (running) stop();
  });
});

function runPhase() {
  const [name, duration, cls] = phases[phaseIndex];
  circle.className = 'circle ' + cls;
  circleText.innerHTML = name + '<span class="dot-wrap"><span>.</span><span>.</span><span>.</span></span>';

  let remaining = duration;
  counter.textContent = remaining;
  clearInterval(countInterval);
  countInterval = setInterval(() => {
    remaining--;
    if (remaining > 0) counter.textContent = remaining;
  }, 1000);

  timer = setTimeout(() => {
    phaseIndex = (phaseIndex + 1) % phases.length;
    runPhase();
  }, duration * 1000);
}

function stop() {
  running = false;
  clearTimeout(timer);
  clearInterval(countInterval);
  circle.className = 'circle idle';
  circleText.innerHTML = 'Mulai';
  counter.textContent = '';
}

circle.addEventListener('click', () => {
  running = !running;
  if (running) {
    phases = patternMap[selectedPattern];
    phaseIndex = 0;
    circle.className = 'circle'; // stop pulse, reset to scale(1) baseline
    requestAnimationFrame(() => {
      requestAnimationFrame(runPhase); // wait a frame so transition starts cleanly
    });
  } else {
    stop();
  }
});
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
